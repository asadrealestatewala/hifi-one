<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Offline · Hifi One</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#f6f7fb;color:#161a33;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
  @media (prefers-color-scheme:dark){body{background:#0b0e24;color:#e9ebf8}p{color:#9aa1c9}}
  main{max-width:360px}
  img{width:72px;height:72px;border-radius:16px}
  h1{font-size:20px;margin:16px 0 8px}
  p{margin:0 0 20px;color:#6b7189;line-height:1.5}
  button{min-height:44px;padding:0 20px;border:0;border-radius:10px;background:#5648e8;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You are offline</h1>
  <p>Hifi One needs an internet connection to show your data. Nothing is saved on this device while offline. Check your connection and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
