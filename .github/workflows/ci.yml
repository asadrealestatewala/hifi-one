# Checks every push and pull request: types, lint, all tests (integration tests use the throwaway Postgres
# service below, never real data) and a production build.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hifi
          POSTGRES_PASSWORD: hifi_ci_only
          POSTGRES_DB: hifi_one_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hifi" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hifi:hifi_ci_only@localhost:5432/hifi_one_test
      TEST_DATABASE_URL: postgresql://hifi:hifi_ci_only@localhost:5432/hifi_one_test
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else-000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npx vitest run
      - run: npm run build
