name: Android APK

# Builds the staff Android app on a GitHub runner (it has the Android SDK) and
# keeps the APK as a private workflow artifact. Nothing is published or released.
# Run it from Actions > Android APK > Run workflow, or it runs on pushes to the
# phone-support branch. The APK is debug-signed, same as the first build.

on:
  workflow_dispatch:
  push:
    branches: [feat/phone-support-app]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --legacy-peer-deps
      - run: npx expo prebuild --platform android --no-install
      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Name the file
        run: |
          mkdir -p ../out
          cp android/app/build/outputs/apk/release/app-release.apk ../out/hifi-one.apk
          sha256sum ../out/hifi-one.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hifi-one-apk
          path: out/hifi-one.apk
          retention-days: 14
