name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        # The server fetches the code with this run's own short-lived token, so a deploy never depends on a GitHub
        # credential stored on the VPS (the repository is private; a stored credential expired on 2026-11-09 and every deploy failed).
        env:
          FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: FETCH_TOKEN,REPO
          script: |
            set -e
            cd /var/www/hifi-one
            git fetch "https://x-access-token:${FETCH_TOKEN}@github.com/${REPO}.git" main
            git reset --hard FETCH_HEAD
            npm ci --legacy-peer-deps
            # Clout Leader reads public post numbers with yt-dlp. A problem here never stops the deploy, and its output stays visible.
            # The standalone build needs no Python or pip; pip is the fallback. Already installed: update it in place.
            export PATH="$HOME/.local/bin:$PATH"
            mkdir -p "$HOME/.local/bin"
            if command -v yt-dlp >/dev/null 2>&1; then
              yt-dlp -U || echo "NOTE: yt-dlp self-update did not run (pip installs update with pip)"
            else
              curl -fsSL -o "$HOME/.local/bin/yt-dlp" https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux && chmod +x "$HOME/.local/bin/yt-dlp" \
                || python3 -m pip install -U --user --break-system-packages yt-dlp \
                || python3 -m pip install -U --user yt-dlp \
                || echo "WARNING: yt-dlp could not be installed; Clout Leader will say so on its Settings page"
            fi
            yt-dlp --version || echo "WARNING: yt-dlp is not runnable on this server"
            npx prisma generate
            npx prisma migrate deploy
            # Registers permissions added by this release and gives them to Super Admin (and, once, to roles whose code definition includes them). Safe to repeat.
            npx tsx scripts/sync-roles.mts
            # Build beside the live build, never over it. Building in place deleted the running server's CSS and JS
            # chunks, so a slow or failed build left every page unstyled. tsc and eslint already run in CI.
            rm -rf .next-build
            NEXT_DIST_DIR=.next-build SKIP_BUILD_CHECKS=1 npm run build
            test -f .next-build/BUILD_ID
            rm -rf .next-previous
            if [ -d .next ]; then mv .next .next-previous; fi
            mv .next-build .next
            pm2 restart hifi-one || pm2 start npm --name hifi-one -- start
            # Clout Leader background worker (separate process so a slow platform never slows the website)
            { pm2 restart hifi-clout-worker --update-env || pm2 start npm --name hifi-clout-worker -- run clout:worker; } || echo "WARNING: the Clout Leader worker did not start"
            pm2 save
