# nginx site for Hifi One on hifimarketing.co (website at /, ERP at /login, /dashboard, /portal ...).
# Install: see docs/DEPLOYMENT.md, "Serving hifimarketing.co". certbot --nginx adds the HTTPS server block
# and the HTTP -> HTTPS redirect to this file; until then it answers on port 80 only.

upstream hifi_one {
    server 127.0.0.1:3000;   # pm2 "hifi-one" (next start)
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name hifimarketing.co www.hifimarketing.co;

    # Uploads go through server actions; the app itself enforces 15 MB per file
    client_max_body_size 16m;

    # Meeting signalling uses server-sent events: no buffering, long-lived responses
    location ~ ^/api/meetings/[^/]+/events$ {
        proxy_pass http://hifi_one;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Project asset library uploads (promo videos) go through a plain form post; the app enforces 100 MB per file
    location ~ ^/api/projects/[^/]+/assets$ {
        client_max_body_size 110m;
        proxy_pass http://hifi_one;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # Fingerprinted build files (JS, CSS, fonts) never change under the same name, so nginx serves them straight from disk
    # with a one-year cache and node is not involved. Next.js already compresses its own pages; this covers the static files.
    location /_next/static/ {
        alias /var/www/hifi-one/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Same security headers as the app sends (add_header in a location replaces the ones from the parent)
        add_header X-Content-Type-Options "nosniff" always;
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_min_length 512;
    }

    location / {
        proxy_pass http://hifi_one;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The sign-in rate limiter and invitation links read these (docs/DEPLOYMENT.md, "HTTPS and proxies")
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
