# nginx site for Hifi One on hifimarketing.co (website at /, ERP at /login, /dashboard, /portal ...).
# Install: see docs/DEPLOYMENT.md, "Serving hifimarketing.co". certbot --nginx adds the HTTPS server block
# and the HTTP -> HTTPS redirect to this file; until then it answers on port 80 only.

upstream hifi_one {
    server 127.0.0.1:3000;   # pm2 "hifi-one" (next start)
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name hifimarketing.co www.hifimarketing.co;

    # Uploads go through server actions; the app itself enforces 15 MB per file
    client_max_body_size 16m;

    # Meeting signalling uses server-sent events: no buffering, long-lived responses
    location ~ ^/api/meetings/[^/]+/events$ {
        proxy_pass http://hifi_one;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://hifi_one;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The sign-in rate limiter and invitation links read these (docs/DEPLOYMENT.md, "HTTPS and proxies")
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
